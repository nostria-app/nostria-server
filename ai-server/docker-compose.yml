services:
  ai-server:
    build:
      context: .
      args:
        LLAMA_CPP_IMAGE: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    image: nostria-ai-server:llama-cpp
    container_name: openresist-ai-server
    restart: unless-stopped
    environment:
      LLAMA_MODEL_FILE: ${LLAMA_MODEL_FILE:-llama-4-scout/model.gguf}
      LLAMA_MODEL_ALIAS: ${LLAMA_MODEL_ALIAS:-llama-4-scout}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-4096}
      LLAMA_THREADS: ${LLAMA_THREADS:-0}
      LLAMA_PARALLEL: ${LLAMA_PARALLEL:-1}
      LLAMA_BATCH_SIZE: ${LLAMA_BATCH_SIZE:-512}
      LLAMA_UBATCH_SIZE: ${LLAMA_UBATCH_SIZE:-128}
      LLAMA_CACHE_TYPE_K: ${LLAMA_CACHE_TYPE_K:-q4_0}
      LLAMA_CACHE_TYPE_V: ${LLAMA_CACHE_TYPE_V:-q4_0}
      LLAMA_MLOCK: ${LLAMA_MLOCK:-false}
      LLAMA_NO_MMAP: ${LLAMA_NO_MMAP:-false}
      LLAMA_EXTRA_ARGS: ${LLAMA_EXTRA_ARGS:-}
    ports:
      - "${AI_SERVER_HOST_BIND:-127.0.0.1}:${AI_SERVER_HOST_PORT:-8088}:8080"
    volumes:
      - /mnt/data/openresist/ai-server/models:/models:ro
      - /mnt/data/openresist/ai-server/cache:/cache
      - /mnt/data/openresist/ai-server/logs:/logs
    shm_size: "2gb"
    ulimits:
      memlock:
        soft: -1
        hard: -1
